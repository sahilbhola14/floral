# examples/burgers/config.yml

# general configuration
job_name: "burgers" # Unique identifier for each run
floral: True # True means residual operator is learned
tune_hyperparameters: False # If true, then hyperparameter sweep is conducted
checkpoint_save_path: "./experiments/burgers/" # Save path for the checkpoints
checkpoint_load_path: Null # If provided, this checkpoint will be loaded
logger_name: "burgers" # Logger folder

# configuration for data
data:
  n_samples: 6000 # total samples for training + validation (for tractability)
  n_train: 100
  n_val: 1000
  LF: # low fidelity
    path: "./low_fidelity.pt"
  HF: # high fidelity
    path: "./high_fidelity.pt"

# configuration for dataloader
dataloader:
  reload: False # True: (Normalized) TensorDataset is reloaded; Must be true for train.state="eval"
  train_ratio: 0.7 # percentage of {n_samples} to train
  num_workers: 5 # Number of workers
  normalize:
    # normalization: (x - mu) / sigma
    target_field:
      enabled: True # True: normalize the field
      auto: True # If True, mean and std are computed.
      mean: [0.1] # For example, [0.5] if want specified (per channel)
      std: [0.5] # For example, [0.5] if want specified (per channel)
    condition:
      enabled: True # True: normalize the field
      auto: True # If True, mean and std are computed.
      mean: [2.0] # For example, [0.5] if want specified (per channel)
      std: [3.5] # For example, [0.5] if want specified (per channel)
    LF_field:
      enabled: True # True: normalize the field
      auto: True # If True, mean and std are computed.
      mean: [0.1] # For example, [0.5] if want specified (per channel)
      std: [0.5] # For example, [0.5] if want specified (per channel)

# configuration for training
train:
  stage: "train" # {train} : train the model; {eval} : Evaluate the model using provided checkpoint
  accelerator: 'gpu'
  devices: 1
  precision: '32-true'

# configuration for flow-matching
flow:
  sig_min: 1.0e-5 # gaussian std for the data
  operator:
    method: FiLMFNO
    # operator parameters
    field:
      hidden_channels: 64
      lifting_channel_ratio: 4
      projection_channel_ratio: 4
      n_layers: 4
      modes: 32
  prior:
    # prior GP measure parameters
    lengthscale: 1.0e-3
    outputscale: 1.0
    confidence: 0.6

# configuration for PDE solution generation
generate:
  minibatch_size: 10 # number of domain points to process at a time (increase if memory is available)
  n_gen: 100 # number of samples generated (for UQ purposes)
  nT: 2 # number of time steps for integration
  method: "dopri5" # method for ODE solver
  atol: 1.0e-5 # absolute tolerance for ODE solver
  rtol: 1.0e-5 # relative tolerance for ODE solver
