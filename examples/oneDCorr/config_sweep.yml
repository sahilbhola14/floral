#hyper parameters sweep config for wandb
method: bayes # Options: "bayes", "random", "grid"

metric:
  name: val_loss
  goal: minimize

parameters:
  learning_rate: # learning rate for the optimizer
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0e-2
  batch_size: # batch size for training
    values: [16, 32, 64, 256]
  max_epochs: # max epochs (limited for testing)
    value: 8
  optimizer: # optimizer
    values: ["Adam", "SGD", "AdamW"]
  weight_decay: # weight decay for scheduler
    distribution: log_uniform_values
    min: 1.0e-6
    max: 1.0e-2
  time_emb_freq: # time embedding freqency for flow-matching
    values: [2, 4, 6]
  scheduler: # optimizer scheduler
    values: ["none", "exponential", "steplr"]
  exponential_scheduler_gamma: # exponential scheduler parameter
    values: [0.9, 0.95, 0.99]
  lr_scheduler_step: # lr scheduler step size
    values: [5, 10]
  lr_scheduler_gamma: # lr scheduler gamma parameter
    values: [0.1, 0.3, 0.5]
