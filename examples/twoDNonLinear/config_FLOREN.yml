# Configutations for 2-D Non Linear Correlation

job_name: "twoDNonLinear_200_samples_100_sensors" # Unique identifier for each run
mfFlow: False # True means residual operator is learned
tune_hyperparameters: False # If true, then hyperparameter sweep is conducted
checkpoint_save_path: "./experiments/twoDNonLinear/" # Save path for the checkpoints
checkpoint_load_path: Null # If provided, this checkpoint will be loaded
logger_name: "twoDNonLinear" # Logger folder

data:
  nx: 1 # Output field dimensionality
  nc: 2500 # Input field dimensionality
  nd: 2 # Domain dimensionality
  nd_c: 1 # Domain dimensionality for the condition
  sensing_strategy: "stratified" # Options: "random", "uniform", "stratified"
  low_fidelity:
    path: "./low_fidelity.npz"
  high_fidelity:
    path: "./high_fidelity.npz"
    n_samples: 200 #Number of samples of the data set to use
    n_sensors: 100 # Number of sensors in the output domain
  test_data_path: "./test_data.npz"

dataloader:
  reload: False # True: (Normalized) TensorDataset is reloaded; Must be true for train.state="eval"
  reload_sensors: False # If True, "sensor_location.pt" file will be used. If 'reload' is True, then it will reload anyways.
  train_ratio: 0.7 # percentage of {n_samples} to train
  num_workers: 6 # Number of workers
  normalize:
    field: True # Normalize the field for training
    condition: True # Normalize the conditon for trianing

train:
  stage: "train" # {train} : train the model; {eval} : Evaluate the model using provided checkpoint
  accelerator: 'gpu'
  devices: 4
  strategy: 'ddp'
  precision: 'bf16-mixed'

flow:
  sig_min: 1.0e-5 # gaussian std for the data

generate:
  minibatch_size: 10 # number of domain points to process at a time (increase if memory is available)
  n_gen: 20 # number of samples generated (for UQ purposes)
  nT: 30 # number of time steps for integration

plot:
  visualize: False
  save: True
