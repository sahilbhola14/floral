# Configutations for 1-D Correlation

job_name: "test_job" # Unique identifier for each run

data:
  corrFlow: True # if True then High fideltiy will use low fideltiy model
  low_fidelity:
    data_path: "./data/one_d_corr_with_input/low_fidelity.npz"
  high_fidelity:
    data_path: "./data/one_d_corr_with_input/high_fidelity.npz"
    checkpoint_save_path: "./experiments/oneDCorr/" # Save path for the checkpoints
    checkpoint_load_path: Null # If provided, this checkpoint will be loaded
    logger_name: "oneDCorr" # Logger folder
    n_samples: 3 #Number of samples of the data set to use (Null means all the data is used)
    n_out_sensors: 100 # Number of sensors in the output domain

dataloader:
  reload: False # True: (Normalized) TensorDataset is reloaded; Must be true for train.state="eval"
  batch_size: 512 # batch size
  train_ratio: 0.7 # percentage of {n_samples} to train
  num_workers: 6 # Number of workers

train:
  stage: "train" # {train} : train the model; {eval} : Evaluate the model using provided checkpoint
  accelerator: 'cpu'
  devices: 1
  strategy: 'ddp'
  precision: 'bf16-mixed'
  max_epochs: 1
  learning_rate: 5.0e-3
  weight_decay: 1.0e-4

flow:
  time_emb_freq: 4 # time embedding
  sig_min: 1.0e-5 # gaussian std for the data
  latent_dim: 35 # latent for the embedding (state and condition)
  num_centers: 10 # Number of RBF centers for domain embedding

generate:
  n_evals: 2 # number of conditions to evaluate
  minibatch_size: 1000 # number of domain points to process at a time (increase if memory is available)
  n_gen: 1 # number of samples generated (for UQ purposes)
  nT: 100 # number of time steps for integration

plot:
  visualize: False
  save: True
